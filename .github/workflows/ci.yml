name: CI

# Runs on every push to main and every PR targeting main.
# Image push only happens on push to main (PRs skip the push so
# untrusted PRs can't publish to GHCR).
#
# Deploy workflow (`deploy.yml`) listens for `workflow_run` of THIS
# workflow with `conclusion == 'success'` on `main` and rolls the
# just-built image out to prod. That deploy gate is what gives us
# "local and prod run the same code".
#
# Repo secrets used:
#   NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY  storefront build arg
#   NEXT_PUBLIC_MEDUSA_BACKEND_URL      storefront build arg
#   NEXT_PUBLIC_BASE_URL                storefront build arg
#   NEXT_PUBLIC_DEFAULT_REGION          storefront build arg (dk/nl)
#
# Repo setting required (one-time):
#   Settings → Actions → General → Workflow permissions → "Read and
#   write permissions". Without this, `docker push` fails with
#   `denied: installation not allowed to Create organization package`
#   even though the login step succeeded.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch — saves minutes on rapid
# push-to-PR cycles. Deploy job is in a separate workflow and uses its
# own concurrency group (`deploy-main`, no cancel) so PR-cancel here
# can't race a deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Lint + build image + push to GHCR
    runs-on: ubuntu-22.04
    # Build is the heavy step (cold-cache ~15 min, warm ~2-4 min).
    # 60 min leaves headroom for a fresh runner + first-time pnpm
    # install on a project this size.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # Lint gates — fail fast before the expensive docker build
      # ----------------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint (backend)
        run: cd apps/backend && pnpm run lint

      # ----------------------------------------------------------------
      # Image build + push (only on push to main, never on PRs)
      # ----------------------------------------------------------------
      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Echoes the short SHA so the build-args block can use it
        # without re-deriving in two places.
        run: |
          echo "sha_short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push image to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ steps.meta.outputs.sha_short }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ secrets.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_DEFAULT_REGION=${{ secrets.NEXT_PUBLIC_DEFAULT_REGION }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      # Build-only for PRs (push: false) so we still surface Dockerfile
      # errors on PRs without publishing to GHCR.
      - name: Build image (PR only, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: medusa-store:pr-${{ github.event.pull_request.number }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ secrets.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_DEFAULT_REGION=${{ secrets.NEXT_PUBLIC_DEFAULT_REGION }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
