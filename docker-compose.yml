services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medusa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medusa-store"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Redis
  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    networks:
      - medusa

  # Medusa Server (production: backend + admin on :9000)
  medusa:
    # `image:` is sed-pinned by .github/workflows/deploy.yml on prod
    # to ghcr.io/profikid/medusa-store:<sha>. Locally, `docker compose
    # up --build` falls back to the build: block. `pull_policy: always`
    # forces a fresh pull on every `up -d` so prod never serves a stale
    # cached image.
    image: medusa-store:local
    build:
      context: .
      args:
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:?Set this in apps/storefront/.env or root .env}
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-https://medusa.tracecore.profikid.nl}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://store.medusa.tracecore.profikid.nl}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-dk}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-phc_CPQgsE99yvvWPkBM6YFcVk95WwTLwZvnALQnVR5BPqv7}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
    pull_policy: always
    container_name: medusa_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "9000"
    # Mount .env files at the exact path Medusa's loadEnv() reads them.
    # We can't COPY them in Dockerfile because .dockerignore blocks .env*.
    volumes:
      - ./apps/backend/.env:/server/apps/backend/.env:ro
    networks:
      - medusa
      - tracecoreagent_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=tracecoreagent_default
      # Main public router: backend API + admin dashboard
      - traefik.http.routers.medusa-api.rule=Host(`medusa.tracecore.profikid.nl`)
      - traefik.http.routers.medusa-api.entrypoints=websecure
      - traefik.http.routers.medusa-api.tls=true
      - traefik.http.routers.medusa-api.tls.certresolver=mytlschallenge
      - traefik.http.services.medusa-api.loadbalancer.server.port=9000
      # HTTP → HTTPS redirect
      - traefik.http.routers.medusa-api-http.rule=Host(`medusa.tracecore.profikid.nl`)
      - traefik.http.routers.medusa-api-http.entrypoints=web
      - traefik.http.routers.medusa-api-http.middlewares=medusa-redirect@docker
      - traefik.http.middlewares.medusa-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.medusa-redirect.redirectscheme.permanent=true

  # Storefront (Next.js production on :8000) - separate hostname
  storefront:
    # Same image as the backend service — the Dockerfile is a
    # monorepo build that exposes both 9000 and 8000; the entrypoint
    # chooses which process to start. The container_name still
    # distinguishes the two. sed-pinned by deploy.yml on prod.
    image: medusa-store:local
    build:
      context: .
      args:
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:?Set this in apps/storefront/.env or root .env}
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-https://medusa.tracecore.profikid.nl}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://store.medusa.tracecore.profikid.nl}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-dk}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-phc_CPQgsE99yvvWPkBM6YFcVk95WwTLwZvnALQnVR5BPqv7}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
    pull_policy: always
    container_name: medusa_storefront
    restart: unless-stopped
    depends_on:
      - medusa
    expose:
      - "8000"
    volumes:
      - ./apps/storefront/.env:/server/apps/storefront/.env:ro
    entrypoint: ["/server/start-storefront.sh"]
    networks:
      - medusa
      - tracecoreagent_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=tracecoreagent_default
      - traefik.http.routers.medusa-store.rule=Host(`store.medusa.tracecore.profikid.nl`)
      - traefik.http.routers.medusa-store.entrypoints=websecure
      - traefik.http.routers.medusa-store.tls=true
      - traefik.http.routers.medusa-store.tls.certresolver=mytlschallenge
      - traefik.http.services.medusa-store.loadbalancer.server.port=8000
      - traefik.http.routers.medusa-store-http.rule=Host(`store.medusa.tracecore.profikid.nl`)
      - traefik.http.routers.medusa-store-http.entrypoints=web
      - traefik.http.routers.medusa-store-http.middlewares=medusa-redirect@docker

volumes:
  postgres_data:

networks:
  medusa:
    driver: bridge
  tracecoreagent_default:
    external: true
    name: tracecoreagent_default
